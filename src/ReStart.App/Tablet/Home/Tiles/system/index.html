<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>System</title><link rel="stylesheet" href="/tile.css"></head>
<body>
  <main id="card" class="card">
    <div id="mode" class="mode"><span class="glyph" aria-hidden="true">&#xEC4A;</span><span id="modeName"></span></div>
    <div class="meters">
      <div class="meter" id="cpu"><span class="name">CPU</span><span class="bar"><i></i></span><span class="num"></span></div>
      <div class="meter" id="gpu"><span class="name">GPU</span><span class="bar"><i></i></span><span class="num"></span></div>
      <div class="meter" id="ram"><span class="name">RAM</span><span class="bar"><i></i></span><span class="num"></span></div>
    </div>
  </main>
  <script src="/tile.js"></script>
</body>
</html>
