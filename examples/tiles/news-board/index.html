<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>ReStart live tile</title>
        <link rel="stylesheet" href="/tile.css" />
    </head>
    <body>
        <article class="tile paper">
            <div class="masthead">
                <span id="caption"></span><span id="number"></span>
            </div>
            <div id="story" data-restart-scroll>
                <div id="headline"></div>
                <div id="summary"></div>
            </div>
            <div id="tile-name" class="tile-name" data-restart-title></div>
        </article>
        <script src="/tile.js"></script>
    </body>
</html>
