name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and core tests
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json
            tools/**/packages.lock.json
      - run: dotnet restore ReStart.slnx --locked-mode
      - name: Check tracked files for credentials and personal paths
        run: ./scripts/check-privacy.ps1
      - name: Verify privacy guard rejection cases
        run: ./scripts/test-privacy.ps1
      - name: Verify public API documentation and guard rejection cases
        run: |
          ./scripts/check-api-docs.ps1 -SelfTest
          ./scripts/check-api-docs.ps1
      - name: Verify architecture and localized README links
        run: |
          ./scripts/check-architecture.ps1
          ./scripts/check-readmes.ps1
      - run: dotnet format whitespace ReStart.slnx --verify-no-changes --no-restore
      - run: dotnet build ReStart.slnx -c Release --no-restore
      - run: dotnet test ReStart.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build
          path: src/ReStart.App/bin/Release/net10.0-windows/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-test-results
          path: artifacts/test-results/*.trx
          retention-days: 14
          if-no-files-found: warn

  native:
    name: Native ${{ matrix.suite }} checks
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [navigation, layout, tiles]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-build
          path: src/ReStart.App/bin/Release/net10.0-windows/
      - name: Verify native suite
        run: ./scripts/test-ui-suite.ps1 -Suite ${{ matrix.suite }} -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-results-${{ matrix.suite }}
          path: |
            artifacts/platform/*/verification.json
            artifacts/platform/*/verify.log
            artifacts/navigation/*
            artifacts/motion/*/start.json
            artifacts/motion/*/fixture-*/*.png
            artifacts/first-input/*.png
            artifacts/first-input/start.json
            artifacts/search-selection/*/*.png
            artifacts/search-selection/*/start.json
            artifacts/fidelity/*/start.json
            artifacts/fidelity/*/fixture-*/*.png
            artifacts/startup/*/*.png
            artifacts/startup/*/start.json
            artifacts/warm-resume/*/*.png
            artifacts/warm-resume/*/start.json
            artifacts/appearance/*/*.png
            artifacts/appearance/*/fixture-*/*.png
            artifacts/settings-preview/check-*/start.json
            artifacts/settings-preview/check-*/fixture-*/*.png
            artifacts/appearance/*/start.json
            artifacts/app-menus/start.json
            artifacts/release-info/*.png
            artifacts/release-info/start.json
            artifacts/placement/*/*.png
            artifacts/placement/*/placement.json
            artifacts/folder-drops/*/start.json
            artifacts/folder-drops/*/fixture-*/*.png
            artifacts/editing/*/start.json
            artifacts/editing/*/fixture-*/*.png
            artifacts/scrolling/*/*.png
            artifacts/scrolling/*/scroll.json
            artifacts/bundled-tiles/*/*.png
            artifacts/bundled-tiles/*/start.json
            artifacts/bundled-tiles/*/render.log
            artifacts/tile-data/*/start.json
            artifacts/tile-data/*/fixture-*/*.png
            artifacts/icons/*/icons-*.png
            artifacts/icons/*/start.json
            artifacts/studio/*/*.png
            artifacts/studio/*/verification.json
            artifacts/studio/*/layout-matrix.json
          retention-days: 14
          if-no-files-found: warn

  build-test:
    # Retain the required check name and fail closed for skipped/cancelled suites.
    name: Windows build and tests
    if: always()
    needs: [build, native]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the build and every native suite
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success

  portable:
    name: Clean portable ${{ matrix.runtime }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Keep this first: a previous solution restore/build would mask missing assets.
      - name: Publish directly from a clean checkout
        run: ./scripts/package.ps1 -Runtime ${{ matrix.runtime }}
      - name: Verify the extracted portable package
        if: matrix.runtime == 'win-x64'
        run: |
          Expand-Archive -LiteralPath artifacts/packages/ReStart-win-x64.zip -DestinationPath artifacts/portable-check/win-x64
          $executable = 'artifacts/portable-check/win-x64/ReStart.exe'
          ./scripts/smoke.ps1 -Executable $executable
          ./scripts/test-lifecycle.ps1 -Executable $executable
          ./scripts/test-update-installation.ps1 -Executable $executable
          ./scripts/test-search-selection.ps1 -Executable $executable
          ./scripts/test-app-menus.ps1 -Executable $executable
          ./scripts/test-bundled-tiles.ps1 -Executable $executable
          ./scripts/test-studio.ps1 -Executable $executable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.runtime == 'win-x64'
        with:
          name: portable-diagnostics
          path: |
            artifacts/search-selection/*/start.json
            artifacts/search-selection/*/*.png
            artifacts/app-menus/*.json
            artifacts/app-menus/*.png
            artifacts/bundled-tiles/*/start.json
            artifacts/bundled-tiles/*/render.log
            artifacts/studio/*/verification.json
            artifacts/studio/*/render.log
          retention-days: 14
