name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ReStart.slnx --locked-mode
      - name: Check tracked files for credentials and personal paths
        run: ./scripts/check-privacy.ps1
      - name: Verify privacy guard rejection cases
        run: ./scripts/test-privacy.ps1
      - name: Verify signed package validation and rejection cases
        run: ./scripts/test-signed-package.ps1
      - name: Verify public API documentation and guard rejection cases
        run: |
          ./scripts/check-api-docs.ps1 -SelfTest
          ./scripts/check-api-docs.ps1
      - name: Verify architecture and localized README links
        run: |
          ./scripts/check-architecture.ps1
          ./scripts/check-readmes.ps1
      - run: dotnet format whitespace ReStart.slnx --verify-no-changes --no-restore
      - run: dotnet build ReStart.slnx -c Release --no-restore
      - run: dotnet test ReStart.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Verify responsive app list and return to home
        run: ./scripts/test-navigation.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify all-apps directory expansion and search
        run: ./scripts/test-navigation.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe -AppFolders
      - name: Verify first-character search during cold startup
        run: ./scripts/test-first-input.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify selected search results and focused Enter actions
        run: ./scripts/test-search-selection.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify local search, jump destinations, navigation and feature switches
        run: ./scripts/test-fidelity.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify prepared startup, typeahead, cancellation and icon caching
        run: ./scripts/test-startup.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify custom themes, settings colors and expanded navigation glyphs
        run: ./scripts/test-appearance.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify launcher motion and interrupted open/close
        run: ./scripts/test-motion.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify app menus and read canonical shell commands
        run: ./scripts/test-app-menus.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify version, licenses, migration and multilingual settings
        run: ./scripts/test-release-info.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify group placement and inline naming
        run: ./scripts/test-placement.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify folder drop timers, tile sizes and destination ownership
        run: ./scripts/test-folder-drops.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify layout editing, selection and undo/redo
        run: ./scripts/test-editing.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify independent scroll axes and themed scrollbars
        run: ./scripts/test-scrolling.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify cold and running-instance filesystem pinning
        run: ./scripts/test-file-pinning.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify bundled tile rendering and local interactions
        run: ./scripts/test-bundled-tiles.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify encrypted tile data connections and native configuration
        run: ./scripts/test-tile-data.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - name: Verify Shell icon sizes and transient status messages
        run: ./scripts/test-icons.ps1 -Executable src/ReStart.App/bin/Release/net10.0-windows/ReStart.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-results
          path: |
            artifacts/test-results/*.trx
            artifacts/navigation/*
            artifacts/motion/*/start.json
            artifacts/motion/*/fixture-*/*.png
            artifacts/first-input/*.png
            artifacts/first-input/start.json
            artifacts/search-selection/*/*.png
            artifacts/search-selection/*/start.json
            artifacts/fidelity/*/start.json
            artifacts/fidelity/*/fixture-*/*.png
            artifacts/startup/*/*.png
            artifacts/startup/*/start.json
            artifacts/appearance/*/*.png
            artifacts/appearance/*/start.json
            artifacts/app-menus/start.json
            artifacts/release-info/*.png
            artifacts/release-info/start.json
            artifacts/placement/*/*.png
            artifacts/placement/*/placement.json
            artifacts/folder-drops/*/start.json
            artifacts/folder-drops/*/fixture-*/*.png
            artifacts/editing/*/start.json
            artifacts/editing/*/fixture-*/*.png
            artifacts/scrolling/*/*.png
            artifacts/scrolling/*/scroll.json
            artifacts/bundled-tiles/*/*.png
            artifacts/bundled-tiles/*/start.json
            artifacts/tile-data/*/start.json
            artifacts/tile-data/*/fixture-*/*.png
            artifacts/icons/*/icons-*.png
            artifacts/icons/*/start.json
          retention-days: 14
          if-no-files-found: warn

  portable:
    name: Clean portable ${{ matrix.runtime }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Keep this first: a previous solution restore/build would mask missing assets.
      - name: Publish directly from a clean checkout
        run: ./scripts/package.ps1 -Runtime ${{ matrix.runtime }}
      - name: Verify duplicate launch handling
        if: matrix.runtime == 'win-x64'
        run: ./scripts/test-lifecycle.ps1 -Executable artifacts/publish/win-x64/ReStart.exe
