name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Verify tag and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and project version differ.' }
          if ((Get-Content docs/release-notes.md -TotalCount 1) -ne "# ReStart v$version") { throw 'Release notes and project version differ.' }
          if ((Get-Content docs/ja/release-notes.md -TotalCount 1) -ne "# ReStart v$version") { throw 'Japanese release notes and project version differ.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release must come from main.' }
      - run: dotnet restore ReStart.slnx --locked-mode
      - run: dotnet build ReStart.slnx -c Release --no-restore
      - run: dotnet test ReStart.slnx -c Release --no-build

  package:
    name: Package ${{ matrix.runtime }}
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: ./scripts/package.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReStart-${{ matrix.runtime }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish private prerelease
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'ReStart-*' --dir packages
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mapfile -t assets < <(find packages -type f \( -name '*.zip' -o -name '*.sha256' \))
          awk '/^---$/{exit} {print}' docs/release-notes.md > release-notes.md
          printf '\n<details>\n<summary>日本語</summary>\n\n' >> release-notes.md
          awk '/^---$/{exit} {print}' docs/ja/release-notes.md >> release-notes.md
          printf '\n</details>\n' >> release-notes.md
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --prerelease --title "ReStart $RELEASE_TAG" --notes-file release-notes.md
