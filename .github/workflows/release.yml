name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Verify tag and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and project version differ.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release must come from main.' }
      - run: dotnet restore ReStart.slnx --locked-mode
      - run: dotnet build ReStart.slnx -c Release --no-restore
      - run: dotnet test ReStart.slnx -c Release --no-build

  package:
    name: Package ${{ matrix.runtime }}
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: ./scripts/package.ps1 -Runtime ${{ matrix.runtime }}
      - name: Verify the extracted portable package before publication
        if: matrix.runtime == 'win-x64'
        run: |
          Expand-Archive -LiteralPath artifacts/packages/ReStart-win-x64.zip -DestinationPath artifacts/portable-check/win-x64
          $executable = 'artifacts/portable-check/win-x64/ReStart.exe'
          ./scripts/smoke.ps1 -Executable $executable
          ./scripts/test-lifecycle.ps1 -Executable $executable
          ./scripts/test-update-installation.ps1 -Executable $executable
          ./scripts/test-search-selection.ps1 -Executable $executable
          ./scripts/test-app-menus.ps1 -Executable $executable
          ./scripts/test-bundled-tiles.ps1 -Executable $executable
          ./scripts/test-studio.ps1 -Executable $executable
      - name: Preserve failed menu and update fixture diagnostics
        if: failure() && matrix.runtime == 'win-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-failure-diagnostics
          path: |
            artifacts/app-menus/*.json
            artifacts/app-menus/*.png
            artifacts/update-installation/*/verification.json
            artifacts/update-installation/*/jobs/*/failure-kind
            artifacts/update-installation/*/jobs/*/outcome
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReStart-${{ matrix.runtime }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'ReStart-*' --dir packages
      - name: Publish reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mapfile -t assets < <(find packages -type f \( -name '*.zip' -o -name '*.sha256' \))
          if [ "${#assets[@]}" -ne 4 ]; then echo 'Expected two ZIPs and two checksum files.' >&2; exit 1; fi
          release=$(gh release view "$RELEASE_TAG" --json isDraft,body)
          if ! jq -e '.isDraft == true and (.body | length > 40)' <<< "$release" >/dev/null; then
            echo 'Create a draft with reviewed English release notes before running publication.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          visibility=$(gh repo view --json visibility --jq .visibility)
          if [ "$visibility" = "PUBLIC" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --title "ReStart $RELEASE_TAG"
          fi
