name: Feature or fidelity improvement
description: Describe a Windows 10 behavior or an explicit ReStart extension. English or Japanese is welcome.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Search existing proposals first. Keep each issue focused on one behavior and sanitize screenshots.
  - type: dropdown
    id: kind
    attributes:
      label: Type of improvement
      options:
        - Windows 10 behavior or visual fidelity
        - ReStart feature or usability improvement
        - JavaScript live tile API or bundled tile
        - Accessibility or localization
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what happens today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior
      description: Include the Windows 10 version, action and expected result, or identify this as an extension.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: References and verification method
